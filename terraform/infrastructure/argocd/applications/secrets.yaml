apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TheMudda6/jenkins-eks-challenge.git
    targetRevision: stable-v1.31
    path: terraform/infrastructure/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
