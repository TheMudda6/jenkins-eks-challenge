apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: jenkins-application
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TheMudda6/jenkins-eks-challenge.git
    targetRevision: stable-v1.31
    path: terraform/k8s/application

  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true