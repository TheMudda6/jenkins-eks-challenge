# -----------------------------------------------------------------------------
#
# Karpenter EC2NodeClass
#
# Purpose:
# Defines the AWS infrastructure configuration Karpenter uses when launching
# EC2 worker nodes for the EKS cluster.
#
# This resource specifies:
# - The AL2023 AMI family used by Karpenter-provisioned nodes.
# - The IAM role assumed by Karpenter-provisioned EC2 instances.
# - The private subnets where Karpenter may launch nodes.
# - The EKS cluster security group used by provisioned nodes.
# - The AMI selection strategy.
# - Instance-store configuration for supported instance types.
# - Tags applied to provisioned EC2 instances.
#
# Dependencies:
# - Karpenter CRDs and controller must be installed before this resource
#   is applied.
# - The IAM role is created by modules/karpenter/iam.tf.
# - Private subnet discovery tags are created by the VPC module.
# - EKS security-group discovery tags are created by the EKS module.
#
# -----------------------------------------------------------------------------

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023

  role: jenkins-eks-karpenter-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: jenkins-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: jenkins-eks

  amiSelectorTerms:
    - alias: al2023@latest

  instanceStorePolicy: RAID0

  tags:
    Name: jenkins-eks-karpenter-node
    karpenter.sh/discovery: jenkins-eks