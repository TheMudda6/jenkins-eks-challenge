# -----------------------------------------------------------------------------
# GP3 StorageClass
#
# Purpose:
# Defines the default Kubernetes StorageClass for dynamically provisioning
# Amazon EBS gp3 volumes.
#
# The StorageClass supports volume expansion and delays volume provisioning
# until a workload is scheduled, allowing Kubernetes to select an appropriate
# Availability Zone.
#
# Reclaim Policy:
# Delete unused volumes when their PersistentVolumeClaim is deleted.
# -----------------------------------------------------------------------------

apiVersion: storage.k8s.io/v1
kind: StorageClass

metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"

provisioner: ebs.csi.aws.com

parameters:
  type: gp3

allowVolumeExpansion: true

reclaimPolicy: Delete

volumeBindingMode: WaitForFirstConsumer

