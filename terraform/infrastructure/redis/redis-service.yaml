# -----------------------------------------------------------------------------
# Redis Service
#
# Purpose:
# Provides stable network access to the Redis Deployment
# from within the Kubernetes cluster.
#
# The ClusterIP Service exposes Redis on its standard port and allows
# application workloads to discover Redis through Kubernetes DNS.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: jenkins

spec:
  selector:
    app: redis

  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP

  type: ClusterIP