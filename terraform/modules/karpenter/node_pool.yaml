# -----------------------------------------------------------------------------
#
# Karpenter NodePool
#
# Purpose:
# Defines the compute capacity Karpenter is allowed to provision for the
# Jenkins EKS platform.
#
# This NodePool:
# - Provisions Linux AMD64 worker nodes.
# - Uses On-Demand EC2 capacity for predictable availability.
# - Allows general-purpose and compute/memory-optimised instance families.
# - Requires EC2 instance generations newer than generation 2.
# - References the default EC2NodeClass for AWS-specific configuration.
# - Limits Karpenter-managed capacity to 8 vCPUs.
# - Enables consolidation to remove unused or underutilised nodes.
# - Automatically expires nodes after 30 days to encourage regular rotation.
#
# Dependencies:
# - Karpenter CRDs must be installed.
# - The Karpenter controller must be running.
# - The "default" EC2NodeClass must exist.
#
# -----------------------------------------------------------------------------

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - "2"

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      expireAfter: 720h

  limits:
    cpu: "8"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m