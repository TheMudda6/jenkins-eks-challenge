name: Terraform Deployment

on:
  push:
    branches:
      - stable-v1.31
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  TF_WORKING_DIR: terraform

  TF_VAR_availability_zones: ${{ vars.TF_AVAILABILITY_ZONES }}
  TF_VAR_aws_load_balancer_controller_policy_name: ${{ vars.TF_AWS_LB_CONTROLLER_POLICY_NAME }}
  TF_VAR_aws_load_balancer_controller_role_name: ${{ vars.TF_AWS_LB_CONTROLLER_ROLE_NAME }}
  TF_VAR_argocd_chart_version: ${{ vars.TF_ARGOCD_CHART_VERSION }}
  TF_VAR_cert_manager_policy_name: ${{ vars.TF_CERT_MANAGER_POLICY_NAME }}
  TF_VAR_cert_manager_role_name: ${{ vars.TF_CERT_MANAGER_ROLE_NAME }}
  TF_VAR_cluster_version: ${{ vars.TF_CLUSTER_VERSION }}
  TF_VAR_ebs_csi_driver_role_name: ${{ vars.TF_EBS_CSI_DRIVER_ROLE_NAME }}
  TF_VAR_eks_cluster_role_name: ${{ vars.TF_EKS_CLUSTER_ROLE_NAME }}
  TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
  TF_VAR_event_producer_policy_name: ${{ vars.TF_EVENT_PRODUCER_POLICY_NAME }}
  TF_VAR_event_producer_role_name: ${{ vars.TF_EVENT_PRODUCER_ROLE_NAME }}
  TF_VAR_event_worker_policy_name: ${{ vars.TF_EVENT_WORKER_POLICY_NAME }}
  TF_VAR_event_worker_role_name: ${{ vars.TF_EVENT_WORKER_ROLE_NAME }}
  TF_VAR_external_dns_policy_name: ${{ vars.TF_EXTERNAL_DNS_POLICY_NAME }}
  TF_VAR_external_dns_role_name: ${{ vars.TF_EXTERNAL_DNS_ROLE_NAME }}
  TF_VAR_github_actions_oidc_role_name: ${{ vars.TF_GITHUB_ACTIONS_OIDC_ROLE_NAME }}
  TF_VAR_github_actions_terraform_role_arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
  TF_VAR_karpenter_chart_version: ${{ vars.TF_KARPENTER_CHART_VERSION }}
  TF_VAR_local_deployment_principal_arn: ${{ vars.TF_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
  TF_VAR_namespace: ${{ vars.TF_NAMESPACE }}
  TF_VAR_node_group_role_name: ${{ vars.TF_NODE_GROUP_ROLE_NAME }}
  TF_VAR_owner: ${{ vars.TF_OWNER }}
  TF_VAR_postgres_db: ${{ vars.TF_POSTGRES_DB }}
  TF_VAR_postgres_user: ${{ vars.TF_POSTGRES_USER }}
  TF_VAR_private_subnets: ${{ vars.TF_PRIVATE_SUBNETS }}
  TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
  TF_VAR_public_subnets: ${{ vars.TF_PUBLIC_SUBNETS }}
  TF_VAR_route53_zone_id: ${{ vars.TF_ROUTE53_ZONE_ID }}
  TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
  TF_VAR_vpc_name: ${{ vars.TF_VPC_NAME }}

  TF_VAR_postgres_password: ${{ secrets.TF_POSTGRES_PASSWORD }}
  TF_VAR_grafana_password: ${{ secrets.TF_GRAFANA_PASSWORD }}

concurrency:
  group: terraform-stable-v1.31
  cancel-in-progress: false

jobs:
  bootstrap-plan:
    name: Terraform Bootstrap Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Import Existing ECR Repositories
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          for service in \
            api-gateway \
            order-service \
            inventory-service \
            payment-service \
            notification-service \
            shipping-service \
            dashboard-api \
            scheduler \
            worker
          do
            repository="jenkins-eks-challenge-dev-${service}"
            address="module.ecr.aws_ecr_repository.services[\"${service}\"]"

            if aws ecr describe-repositories \
              --region "$AWS_REGION" \
              --repository-names "$repository" >/dev/null 2>&1; then

              if ! terraform state show "$address" >/dev/null 2>&1; then
                terraform import "$address" "$repository"
              fi
            fi
          done

          echo "✓ ECR repositories are ready for Terraform."

      - name: Terraform Bootstrap Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var="terraform_bootstrap=true" \
            -target=module.vpc \
            -target=module.sqs \
            -target=module.ecr \
            -target=module.secrets \
            -target=module.iam \
            -target=module.eks \
            -out=tfplan-bootstrap

      - name: Upload Terraform Bootstrap Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-bootstrap-plan
          path: terraform/tfplan-bootstrap
          retention-days: 1
          if-no-files-found: error

  bootstrap-apply:
    name: Terraform Bootstrap Apply
    needs: bootstrap-plan
    runs-on: ubuntu-latest

    environment:
      name: terraform-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download Terraform Bootstrap Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-bootstrap-plan
          path: terraform

      - name: Terraform Bootstrap Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan-bootstrap

  platform-plan:
    name: Terraform Platform Plan
    needs: bootstrap-apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Get EKS connection details
        id: eks
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"

          terraform output -raw cluster_certificate_authority_data > /tmp/cluster-ca.txt

      - name: Terraform Platform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          KUBERNETES_HOST: ${{ steps.eks.outputs.cluster_endpoint }}
          KUBERNETES_CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: |
          KUBERNETES_CA_CERTIFICATE="$(cat /tmp/cluster-ca.txt)"

          terraform plan \
            -input=false \
            -var="terraform_bootstrap=false" \
            -var="kubernetes_host=${KUBERNETES_HOST}" \
            -var="kubernetes_ca_certificate=${KUBERNETES_CA_CERTIFICATE}" \
            -var="kubernetes_cluster_name=${KUBERNETES_CLUSTER_NAME}" \
            -out=tfplan-platform

      - name: Upload Terraform Platform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-platform-plan
          path: terraform/tfplan-platform
          retention-days: 1
          if-no-files-found: error

  platform-apply:
    name: Terraform Platform Apply
    needs: platform-plan
    runs-on: ubuntu-latest

    environment:
      name: terraform-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download Terraform Platform Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-platform-plan
          path: terraform

      - name: Terraform Platform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan-platform
