apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e-commerce-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TheMudda6/jenkins-eks-challenge.git
    targetRevision: stable-v1.31
    path: terraform/infrastructure/application/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncOptions:
    - CreateNamespace=true
