# -----------------------------------------------------------------------------
# Jenkins Restore Test Pod
#
# Purpose:
# Provides a temporary workload for validating that restored Jenkins storage
# can be successfully mounted and accessed by a Kubernetes Pod.
#
# The Pod mounts the restored PersistentVolumeClaim at /data and remains
# running long enough for manual verification.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Pod

metadata:
  name: restore-test
  namespace: jenkins

spec:
  containers:
    - name: restore-test
      image: busybox
      command: ["sleep", "3600"]

      volumeMounts:
        - name: restored-volume
          mountPath: /data

  volumes:
    - name: restored-volume
      persistentVolumeClaim:
        claimName: jenkins-pvc-restore