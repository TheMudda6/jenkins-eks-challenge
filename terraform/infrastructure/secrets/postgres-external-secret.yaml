# -----------------------------------------------------------------------------
# PostgreSQL External Secret
#
# Purpose:
# Defines the ExternalSecret resource responsible for synchronizing the
# PostgreSQL credentials from AWS Secrets Manager into Kubernetes.
# -----------------------------------------------------------------------------

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: jenkins

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: postgres-secret
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: jenkins/postgres
        property: POSTGRES_DB

    - secretKey: POSTGRES_USER
      remoteRef:
        key: jenkins/postgres
        property: POSTGRES_USER

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: jenkins/postgres
        property: POSTGRES_PASSWORD