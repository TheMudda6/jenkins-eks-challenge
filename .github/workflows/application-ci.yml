# -----------------------------------------------------------------------------
# Application CI/CD
#
# Builds, tests, scans and publishes all nine application services.
# Images are tagged with the immutable Git commit SHA and pushed to the
# service-specific ECR repository.
# -----------------------------------------------------------------------------

name: Application CI

on:
  push:
    branches:
      - main
      - stable-v1.31
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: 893061519920.dkr.ecr.eu-west-2.amazonaws.com

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - dashboard-api
          - scheduler
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Download Go modules
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Build service
        working-directory: services/${{ matrix.service }}
        run: go build .

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  security:
    name: Security scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - dashboard-api
          - scheduler
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: security

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - dashboard-api
          - scheduler
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/jenkins-eks-challenge-dev-${{ matrix.service }}:${{ github.sha }}" \
            "services/${{ matrix.service }}"

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/jenkins-eks-challenge-dev-${{ matrix.service }}:${{ github.sha }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          docker push \
            "${{ env.ECR_REGISTRY }}/jenkins-eks-challenge-dev-${{ matrix.service }}:${{ github.sha }}"

  update-manifests:
    name: Update Kubernetes manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tags
        run: |
          for service in \
            api-gateway \
            order-service \
            inventory-service \
            payment-service \
            notification-service \
            shipping-service \
            dashboard-api \
            scheduler \
            worker; do

            sed -i \
              "s#^\(\s*image: .*jenkins-eks-challenge-dev-${service}\):.*#\1:${GITHUB_SHA}#" \
              "terraform/infrastructure/application/base/services/${service}/deployment.yaml"
          done

      - name: Validate Kustomize
        run: |
          kubectl kustomize terraform/infrastructure/application/base >/dev/null
          kubectl kustomize terraform/infrastructure/application/overlays/dev >/dev/null
          kubectl kustomize terraform/infrastructure/application/overlays/prod >/dev/null

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add terraform/infrastructure/application/base/services/*/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
            exit 0
          fi

          git commit \
            -m "chore(cd): update service images to ${GITHUB_SHA} [skip ci]"

          git push
