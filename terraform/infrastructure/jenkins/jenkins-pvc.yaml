# -----------------------------------------------------------------------------
# Jenkins Persistent Volume Claim
#
# Purpose:
# Provides persistent storage for the Jenkins controller.
#
# The PVC requests a 10Gi Amazon EBS-backed volume using the gp3 StorageClass,
# ensuring Jenkins data survives pod recreation.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: jenkins
spec:
  storageClassName: gp3

  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi