# --------------------------------------------------------------------
# Application CI and Container Build Workflow
#
# Purpose:
# Build, test and publish the application container automatically
# through GitHub Actions.
#
# This workflow compiles and tests the Go application, authenticates
# to AWS using GitHub Actions OIDC, builds the Docker image and
# publishes versioned and latest images to Amazon ECR.
# --------------------------------------------------------------------

name: Application CI

on:
  push:
    branches:
      - main
      - stable-v1.31

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: application

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version: "1.25.0"
                cache-dependency-path: application/go.sum

            - name: Download Go Modules
              working-directory: application
              run: go mod download

            - name: Build Application
              working-directory: application
              run: go build -o api ./cmd/api

            - name: Run tests
              working-directory: application
              run: go test ./...

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build Docker image
              run: |
                docker build \
                -t ${{ env.IMAGE_NAME }}:latest \
                -f application/Dockerfile \
                application

            - name: Tag Docker image
              run: |
                docker tag ${{ env.IMAGE_NAME }}:latest \
                  ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

                docker tag ${{ env.IMAGE_NAME }}:latest \
                  ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest

            - name: Push Docker image
              run: |
                docker push \
                  ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

                docker push \
                  ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest