# -----------------------------------------------------------------------------
# Prometheus Stack ArgoCD Application
#
# Purpose:
# Defines the ArgoCD Application responsible for deploying the
# kube-prometheus-stack monitoring platform.
#
# The stack provides Prometheus for metrics collection, Grafana for
# visualization and Alertmanager for alert management.
#
# Persistent storage is provided through the gp3 StorageClass for both
# Grafana and Prometheus.
#
# Note:
# The current Grafana administrator password is a development default and
# should be replaced with securely managed credentials in production.
# -----------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 72.6.2
    helm:
      skipCrds: false
      values: |
        grafana:
          enabled: true
          adminPassword: admin
          persistence:
            enabled: true
            storageClassName: gp3
            size: 5Gi

        prometheus:
          prometheusSpec:
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true