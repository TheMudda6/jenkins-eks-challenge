# -----------------------------------------------------------------------------
# Monitoring Kustomization
#
# Purpose:
# Defines the Kubernetes resources required to deploy the monitoring platform.
#
# Kustomize uses this file as the entry point for the monitoring namespace
# and the ArgoCD Application that manages the Prometheus stack.
# -----------------------------------------------------------------------------

resources:
  - namespace.yaml
  - prometheus-stack.yaml
  - api-gateway-servicemonitor.yaml
  - order-service-servicemonitor.yaml
  - inventory-service-servicemonitor.yaml
  - payment-service-servicemonitor.yaml
  - notification-service-servicemonitor.yaml
  - shipping-service-servicemonitor.yaml
  - worker-servicemonitor.yaml
  - scheduler-servicemonitor.yaml
  - dashboard-api-servicemonitor.yaml
  - dashboards/api-gateway.yaml
  - dashboards/order-service.yaml
  - dashboards/inventory-service.yaml
  - dashboards/payment-service.yaml
  - dashboards/notification-service.yaml
  - dashboards/shipping-service.yaml
  - dashboards/dashboard-api.yaml
  - dashboards/worker.yaml
  - dashboards/scheduler.yaml
  - prometheus-rules.yaml
