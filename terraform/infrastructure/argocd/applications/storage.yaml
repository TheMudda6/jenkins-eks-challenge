apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TheMudda6/jenkins-eks-challenge.git
    targetRevision: stable-v1.31
    path: terraform/infrastructure/storage

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
