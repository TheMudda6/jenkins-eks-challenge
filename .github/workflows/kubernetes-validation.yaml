# --------------------------------------------------------------------
# Kubernetes Manifest Validation Workflow
#
# Purpose:
# Validate Kubernetes manifests automatically through GitHub Actions.
#
# This workflow verifies that deprecated External Secrets API versions
# are not present, renders the Kustomize configurations, and validates
# the resulting Kubernetes resources before changes are merged.
# --------------------------------------------------------------------

name: Kubernetes Manifest Validation

on:
  pull_request:
  push:
    branches:
      - stable-v1.31

jobs:
  validate-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check External Secrets API version
        run: |
          if grep -R "external-secrets.io/v1beta1" terraform/infrastructure; then
            echo "Old External Secrets API detected"
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render development platform
        run: |
          kubectl kustomize terraform/infrastructure > /tmp/platform-dev.yaml

      - name: Render production application
        run: |
          kubectl kustomize terraform/infrastructure/application/overlays/prod > /tmp/application-prod.yaml

      - name: Validate development platform
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.33.0 \
            /tmp/platform-dev.yaml

      - name: Validate production application
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.33.0 \
            /tmp/application-prod.yaml
