# -----------------------------------------------------------------------------
# PostgreSQL Headless Service
#
# Purpose:
# Provides stable network identity and DNS discovery for the PostgreSQL
# StatefulSet.
#
# The headless Service uses clusterIP: None so PostgreSQL can be addressed
# directly by its stable StatefulSet DNS identity.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: jenkins

spec:

  # Setting clusterIP to None creates a headless Service.
  # This allows StatefulSet pods to have stable DNS records.

  clusterIP: None

  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432